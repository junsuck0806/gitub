name: Notice Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (UTC 기준이지만 간격 실행이라 상관없음)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python notice.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: 상태 파일 커밋
        run: |
          git config user.name "notice-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_seen.json
          git diff --cached --quiet || git commit -m "update last_seen"
          git push
